<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 62" width="100%" height="100%" role="img">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="warmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .fade-in { animation: fadeIn 0.9s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .fade-in { animation: none; opacity: 1; }
    }
  </style>
  <rect width="260" height="62" rx="4" fill="#c57e50"/>
  <rect x="3" y="3" width="254" height="56" rx="3" fill="none"
        stroke="#1e1e1e" stroke-width="2" filter="url(#pencil)"/>
  <text x="130" y="31" text-anchor="middle" font-family="'Comic Sans MS', 'Comic Neue', cursive"
        font-size="18" font-weight="bold" fill="#1e1e1e">Telegram</text>
  <text x="130" y="48" text-anchor="middle" font-family="'Inter', system-ui, sans-serif"
        font-size="9.5" letter-spacing="1" fill="#4a2f1d">@l_SkipOne_l</text>
</svg>
