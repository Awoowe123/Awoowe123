<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" height="100%" role="img">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="warmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .fade-in { animation: fadeIn 0.9s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .fade-in { animation: none; opacity: 1; }
    }
  </style>
  <rect width="1000" height="330" rx="4" fill="#dcd8d0"/>
  <rect x="3" y="3" width="994" height="324" rx="3" fill="none"
        stroke="#c57e50" stroke-width="2" filter="url(#pencil)"/>
  <rect x="10" y="10" width="980" height="310" rx="2" fill="none"
        stroke="#1e1e1e" stroke-width="0.6" stroke-dasharray="6 4" opacity="0.18"/>
  <text x="500" y="60" text-anchor="middle" font-family="'Comic Sans MS', 'Comic Neue', cursive"
        font-size="32" font-weight="bold" fill="#1e1e1e">Proven, not claimed</text>
  <path d="M 390,74 Q 500,72 610,74" fill="none"
        stroke="#c57e50" stroke-width="2" opacity="0.55" filter="url(#pencil)"/>
  <text x="500" y="100" text-anchor="middle" font-family="'Inter', system-ui, sans-serif"
        font-size="12.5" fill="#4e4a42">Three things this profile can back with a date instead of an adjective.</text>
  <g class="fade-in" style="animation-delay: 0.15s">
    <rect x="28" y="132" width="300" height="152" rx="3"
          fill="#1e1e1e" fill-opacity="0.035" stroke="#1e1e1e" stroke-width="1.4"
          filter="url(#pencil)"/>
    <text x="44" y="156" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600"
          letter-spacing="1.8" fill="#7e7a72">FAILOVER</text>
    <text x="44" y="186" font-family="'Comic Sans MS', 'Comic Neue', cursive" font-size="26" font-weight="bold"
          fill="#c57e50">5m30s</text>
    <text x="44" y="208" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">Production network cut on purpose, twice.</text>
    <text x="44" y="227" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">DNS moved, the warm standby raised itself,</text>
    <text x="44" y="246" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">the college kept reading its timetable.</text>
  <path d="M 44,258 Q 178,256 312,258" fill="none"
        stroke="#1e1e1e" stroke-width="1" opacity="0.16" filter="url(#pencil)"/>
    <text x="44" y="272" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic"
          fill="#7e7a72">no human action - 2026-09-18</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.32999999999999996s">
    <rect x="356" y="132" width="300" height="152" rx="3"
          fill="#1e1e1e" fill-opacity="0.035" stroke="#1e1e1e" stroke-width="1.4"
          filter="url(#pencil)"/>
    <text x="372" y="156" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600"
          letter-spacing="1.8" fill="#7e7a72">BACKUPS</text>
    <text x="372" y="186" font-family="'Comic Sans MS', 'Comic Neue', cursive" font-size="26" font-weight="bold"
          fill="#c57e50">restored</text>
    <text x="372" y="208" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">Copies are not merely written. They are</text>
    <text x="372" y="227" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">restored weekly into a scratch database and</text>
    <text x="372" y="246" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">row-counted against the dump's own claim.</text>
  <path d="M 372,258 Q 506,256 640,258" fill="none"
        stroke="#1e1e1e" stroke-width="1" opacity="0.16" filter="url(#pencil)"/>
    <text x="372" y="272" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic"
          fill="#7e7a72">a dump that lies fails this check</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.51s">
    <rect x="684" y="132" width="300" height="152" rx="3"
          fill="#1e1e1e" fill-opacity="0.035" stroke="#1e1e1e" stroke-width="1.4"
          filter="url(#pencil)"/>
    <text x="700" y="156" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600"
          letter-spacing="1.8" fill="#7e7a72">IN USE</text>
    <text x="700" y="186" font-family="'Comic Sans MS', 'Comic Neue', cursive" font-size="26" font-weight="bold"
          fill="#c57e50">2 products</text>
    <text x="700" y="208" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">A real college runs its timetable and its</text>
    <text x="700" y="227" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">classroom games on them every working day.</text>
    <text x="700" y="246" font-family="'Inter', system-ui, sans-serif"
          font-size="12.5" fill="#4e4a42">Tenant isolation is tested on every deploy.</text>
  <path d="M 700,258 Q 834,256 968,258" fill="none"
        stroke="#1e1e1e" stroke-width="1" opacity="0.16" filter="url(#pencil)"/>
    <text x="700" y="272" font-family="'Inter', system-ui, sans-serif" font-size="9" font-style="italic"
          fill="#7e7a72">shipped and still on call for it</text>
  </g>
  <text x="500" y="312" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9"
        letter-spacing="1.4" fill="#7e7a72">EVERY LINE HERE IS SOMETHING I CAN SHOW ON REQUEST</text>
</svg>
