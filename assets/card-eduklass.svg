<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="100%" height="100%" role="img">
  <defs>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="warmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .fade-in { animation: fadeIn 0.9s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .fade-in { animation: none; opacity: 1; }
    }
  </style>
  <rect width="440" height="170" rx="4" fill="#dcd8d0"/>
  <rect x="3" y="3" width="434" height="164" rx="3" fill="none"
        stroke="#1e1e1e" stroke-width="2" filter="url(#pencil)"/>
  <rect x="10" y="10" width="420" height="150" rx="2" fill="none"
        stroke="#1e1e1e" stroke-width="0.6" stroke-dasharray="6 4" opacity="0.18"/>
  <g class="fade-in">
    <text x="24" y="44" font-family="'Comic Sans MS', 'Comic Neue', cursive" font-size="17" font-weight="bold"
          fill="#c57e50">[01]</text>
    <text x="72" y="46" font-family="'Comic Sans MS', 'Comic Neue', cursive" font-size="25" font-weight="bold"
          fill="#1e1e1e">EduKlass Schedule</text>
    <circle cx="406" cy="36" r="4" fill="#c57e50"
            filter="url(#warmGlow)" class="pulse"/>
  <path d="M 24,62 Q 220,60 416,62" fill="none"
        stroke="#c57e50" stroke-width="1.6" opacity="0.45" filter="url(#pencil)"/>
    <text x="24" y="84" font-family="'Inter', system-ui, sans-serif" font-size="12.5" fill="#4e4a42">College timetable platform. Imports the college's own</text>
    <text x="24" y="102" font-family="'Inter', system-ui, sans-serif" font-size="12.5" fill="#4e4a42">spreadsheets, and survives the server dying.</text>
    <text x="24" y="126" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#7e7a72"
          letter-spacing="0.6">Next.js - NestJS - Prisma - PostgreSQL</text>
  <path d="M 24,136 Q 220,134 416,136" fill="none"
        stroke="#1e1e1e" stroke-width="1" opacity="0.14" filter="url(#pencil)"/>
    <text x="24" y="154" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="600"
          letter-spacing="1.6" fill="#a86134">IN PRODUCTION</text>
    <text x="416" y="154" text-anchor="end" font-family="${UI}" font-size="8.5"
          letter-spacing="1.2" fill="${MUTED}">${esc("OPEN ->")}</text>
  </g>
</svg>
